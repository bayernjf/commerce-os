# Production-shaped local deployment. The container binds only to the loopback
# interface; a reverse proxy on the host (Caddy for automatic TLS, or nginx +
# certbot) terminates the domain/TLS and forwards to 127.0.0.1:8787.
#
# Secrets and the real environment are provided via an untracked `.env` file
# (see .env.example). Never commit `.env`.
services:
  commerce-os:
    build:
      context: .
      additional_contexts:
        # Base image resolved from the local image store (no registry auth).
        base: docker-image://node:22-slim
        # Cross-repo typed decision client (file: dependency in package.json).
        zeusclient: ../zeus/packages/zeus-client
    image: commerce-os:latest
    env_file: .env
    environment:
      COMMERCE_DB_DRIVER: sqlite
      COMMERCE_SQLITE_PATH: /data/commerce-os.db
      COMMERCE_HOST: 0.0.0.0
      COMMERCE_PORT: "8787"
    volumes:
      - commerce-data:/data
    ports:
      # Loopback only; the reverse proxy exposes 80/443 publicly.
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    healthcheck:
      # Liveness for the container runtime; readiness is /readyz.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  # State snapshots. Backs up the single SQLite file with VACUUM INTO, verifies
  # integrity and per-table counts, writes a manifest and prunes to N snapshots.
  # The data volume is mounted read-only on purpose: a backup must never write
  # to the thing it is protecting.
  #
  # The loop keeps running when a snapshot fails (no restart storms, no silent
  # stop); the failure stays in the container log and `|| true` only affects the
  # exit code, not the output.
  backup:
    image: node:22-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    depends_on:
      - commerce-os
    volumes:
      - commerce-data:/data:ro
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro
      - ./scripts/backup-commerce.mjs:/scripts/backup-commerce.mjs:ro
    environment:
      COMMERCE_SQLITE_PATH: /data/commerce-os.db
      COMMERCE_BACKUP_DIR: /backups
      COMMERCE_BACKUP_INTERVAL_SECONDS: ${COMMERCE_BACKUP_INTERVAL_SECONDS:-86400}
      COMMERCE_BACKUP_KEEP: ${COMMERCE_BACKUP_KEEP:-7}
    entrypoint: ["sh", "/scripts/backup-loop.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  commerce-data:
