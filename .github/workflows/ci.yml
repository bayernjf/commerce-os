name: ci

on:
  push:
    branches: [main, dev, "**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: "Clone and build sibling zeus (file: dependency zeus-client)"
        run: |
          ZEUS_DIR="$GITHUB_WORKSPACE/../zeus"
          git clone --depth 1 https://github.com/${{ github.repository_owner }}/zeus.git "$ZEUS_DIR"
          # zeus main depends on @model-hub/model-kit via file:../model-hub;
          # provide the sibling the same way zeus's own CI does, or its
          # build fails with TS2307.
          git clone --depth 1 https://github.com/${{ github.repository_owner }}/model-hub.git "$GITHUB_WORKSPACE/../model-hub"
          npm ci --prefix "$GITHUB_WORKSPACE/../model-hub" --no-audit --no-fund
          cd "$ZEUS_DIR"
          npm ci
          npm run build

      - name: Install dependencies
        run: npm install
      - name: Verify paired migrations (sqlite + postgres)
        run: npm run check:migrations
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + e2e tests
        run: npm test
      - name: Build
        run: npm run build
