name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Checkout sibling zeus repo (file: dependency zeus-client)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/zeus
          path: ../zeus
          # M3 runs on a local sibling checkout; when zeus is not yet public
          # set an SSH/deploy key secret or publish zeus-client to a registry.
          continue-on-error: true

      - name: Install dependencies
        run: npm install
      - name: Verify paired migrations (sqlite + postgres)
        run: npm run check:migrations
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + e2e tests
        run: npm test
      - name: Build
        run: npm run build
